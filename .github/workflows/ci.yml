name: CI / CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.9.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check project versions
        run: npm run check:versions

      - name: Type check
        run: npm run typecheck

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

  windows-rust:
    name: Windows Rust Checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          components: clippy

      - name: Check Windows Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Windows Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Windows Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  package-tauri:
    name: Package Tauri (${{ matrix.platform }})
    needs:
      - quality
      - windows-rust
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x86_64
            expected_arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.9.0
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Validate architecture
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Expected ' + process.env.EXPECTED_ARCH + ', got ' + process.arch)"

      - name: Validate release version
        run: node scripts/sync-tauri-version.mjs --check --tag "${{ github.ref_name }}"

      - name: Validate embedded update public key
        shell: bash
        env:
          WINKY_UPDATE_PUBLIC_KEY: ${{ secrets.WINKY_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          node -e "const key = Buffer.from(process.env.WINKY_UPDATE_PUBLIC_KEY || '', 'base64'); if (key.length !== 32) throw new Error('WINKY_UPDATE_PUBLIC_KEY must be a base64-encoded 32-byte Ed25519 public key')"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Configure optional Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -and -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Add-Content -Path $env:GITHUB_ENV -Value 'WINKY_WINDOWS_PACKAGE_SIGNED=false'
            Write-Host 'Windows signing secrets are not configured; building an unsigned package.'
            exit 0
          }
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must be configured together.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'winky-signing.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $certificate = $importedCertificates | Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $certificate -or -not $certificate.Thumbprint) {
            throw 'Failed to import the Windows code-signing certificate.'
          }
          $signerThumbprint = $certificate.Thumbprint.Replace(' ', '').ToUpperInvariant()
          $tauriConfig = @{bundle = @{windows = @{certificateThumbprint = $certificate.Thumbprint}}} | ConvertTo-Json -Compress -Depth 5
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_CONFIG=$tauriConfig"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_SIGNER_THUMBPRINT=$signerThumbprint"
          Add-Content -Path $env:GITHUB_ENV -Value "WINKY_WINDOWS_SIGNER_THUMBPRINT=$signerThumbprint"
          Add-Content -Path $env:GITHUB_ENV -Value 'WINKY_WINDOWS_PACKAGE_SIGNED=true'
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Build desktop package
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          WINKY_UPDATE_PUBLIC_KEY: ${{ secrets.WINKY_UPDATE_PUBLIC_KEY }}
        with:
          tauriScript: npm run tauri
          args: --verbose

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && env.WINKY_WINDOWS_PACKAGE_SIGNED == 'true'
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_SIGNER_THUMBPRINT) { throw 'Expected Windows signer thumbprint is missing.' }
          $installers = @(
            Get-ChildItem -Path 'src-tauri/target/release/bundle' -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($installer.Name): $($signature.Status)"
            }
            if (-not $signature.SignerCertificate) {
              throw "Authenticode signer certificate is missing for $($installer.Name)."
            }
            $actualThumbprint = $signature.SignerCertificate.Thumbprint.Replace(' ', '').ToUpperInvariant()
            if ($actualThumbprint -ne $env:WINDOWS_SIGNER_THUMBPRINT) {
              throw "Unexpected Authenticode signer for $($installer.Name): $actualThumbprint"
            }
            Write-Host "Verified $($installer.Name), signer $actualThumbprint"
          }

      - name: Collect release artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          source_dir="src-tauri/target/release/bundle"
          package_dir="release-package/${PLATFORM}"
          metadata_dir="release-package/metadata"
          mkdir -p "${package_dir}" "${metadata_dir}"

          case "${PLATFORM}" in
            windows-x86_64)
              mapfile -d '' -t preferred_candidates < <(
                find "${source_dir}" -type f -name '*.exe' -print0 | sort -z
              )
              if [ "${#preferred_candidates[@]}" -ne 1 ]; then
                echo "Expected exactly one preferred EXE for ${PLATFORM}, found ${#preferred_candidates[@]}." >&2
                printf 'Candidate: %s\n' "${preferred_candidates[@]}" >&2
                exit 1
              fi
              preferred="${preferred_candidates[0]}"
              find "${source_dir}" -type f \( -name '*.exe' -o -name '*.msi' \) -exec cp {} "${package_dir}/" \;
              ;;
            *)
              echo "Unsupported release platform: ${PLATFORM}"
              exit 1
              ;;
          esac
          filename="$(basename "${preferred}")"
          sha256="$(python -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "${preferred}")"
          size="$(python -c "import os,sys; print(os.path.getsize(sys.argv[1]))" "${preferred}")"
          python - "${PLATFORM}" "${filename}" "${sha256}" "${size}" "${metadata_dir}/${PLATFORM}.json" <<'PY'
          import json
          import sys

          platform, filename, sha256_hash, size, output = sys.argv[1:]
          with open(output, 'w', encoding='utf-8', newline='\n') as handle:
              json.dump({
                  'platform': platform,
                  'filename': filename,
                  'sha256': sha256_hash,
                  'size': int(size),
              }, handle, separators=(',', ':'))
              handle.write('\n')
          PY

      - name: Upload release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-package-${{ matrix.platform }}
          path: release-package/**/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Signed Release
    needs: package-tauri
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: winky-production-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-1
      AWS_S3_FORCE_PATH_STYLE: true
      S3_BUCKET: 324718a4-2cc5dd7a-917b-4e82-87c5-b9d5f8de16ba
      S3_ENDPOINT: https://s3.twcstorage.ru
      WINKY_UPDATE_PUBLIC_KEY: ${{ secrets.WINKY_UPDATE_PUBLIC_KEY }}
      WINKY_UPDATE_SIGNING_KEY: ${{ secrets.WINKY_UPDATE_SIGNING_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.9.0

      - name: Download release packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-package-*
          path: release-package
          merge-multiple: true

      - name: Validate release tools and secrets
        shell: bash
        run: |
          set -euo pipefail
          command -v aws
          command -v openssl
          command -v curl
          command -v gh
          command -v sha256sum
          test -n "${AWS_ACCESS_KEY_ID}"
          test -n "${AWS_SECRET_ACCESS_KEY}"
          test -n "${WINKY_UPDATE_PUBLIC_KEY}"
          test -n "${WINKY_UPDATE_SIGNING_KEY}"

      - name: Create and sign update manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/sync-tauri-version.mjs --check --tag "${RELEASE_TAG}"
          published_at="$(git show -s --format=%cI "${RELEASE_TAG}^{commit}")"
          node scripts/release-manifest.mjs create-payload \
            release-package/metadata \
            "${RELEASE_TAG}" \
            "${S3_ENDPOINT}/${S3_BUCKET}/winky" \
            manifest.json \
            "${published_at}"

          signing_key="${RUNNER_TEMP}/winky-update-signing-key.der"
          derived_public="${RUNNER_TEMP}/winky-update-derived-public.der"
          printf '%s' "${WINKY_UPDATE_SIGNING_KEY}" | base64 --decode > "${signing_key}"
          openssl pkey -in "${signing_key}" -inform DER -pubout -outform DER -out "${derived_public}"
          node - "${derived_public}" <<'NODE'
          const fs = require('fs');
          const derived = fs.readFileSync(process.argv[2]).subarray(-32);
          const expected = Buffer.from(process.env.WINKY_UPDATE_PUBLIC_KEY, 'base64');
          if (expected.length !== 32 || !derived.equals(expected)) {
              throw new Error('Update signing key does not match WINKY_UPDATE_PUBLIC_KEY.');
          }
          NODE
          openssl pkeyutl -sign -rawin -inkey "${signing_key}" -keyform DER \
            -in manifest.json -out manifest.sig
          node scripts/release-manifest.mjs create-envelope \
            manifest.json manifest.sig latest.json
          node scripts/release-manifest.mjs create-legacy \
            manifest.json legacy-latest.json
          rm -f "${signing_key}" "${derived_public}"

      - name: Validate release ordering
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for manifest_name in latest-v2.json latest.json; do
            object_key="winky/${manifest_name}"
            published_manifest="published-${manifest_name}"
            get_error="$(mktemp)"
            get_status=0

            aws s3api get-object \
              --bucket "${S3_BUCKET}" \
              --key "${object_key}" \
              --endpoint-url "${S3_ENDPOINT}" \
              "${published_manifest}" >/dev/null 2>"${get_error}" || get_status=$?

            if [ "${get_status}" -eq 0 ]; then
              rm -f "${get_error}"
              node scripts/release-manifest.mjs check-monotonic \
                "${published_manifest}" manifest.json
              break
            fi

            if grep -Eq '(NoSuchKey|\(404\)|HTTP 404|Not Found)' "${get_error}"; then
              rm -f "${published_manifest}" "${get_error}"
              continue
            fi

            echo "GET failed for ${object_key}." >&2
            cat "${get_error}" >&2
            rm -f "${published_manifest}" "${get_error}"
            exit 1
          done

          node scripts/release-manifest.mjs list-artifacts manifest.json >/dev/null

      - name: Publish immutable versioned objects
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path

          read_head() {
            local object_key="$1"
            local output_file="$2"
            local error_file="$3"
            if aws s3api head-object \
              --bucket "${S3_BUCKET}" \
              --key "${object_key}" \
              --endpoint-url "${S3_ENDPOINT}" >"${output_file}" 2>"${error_file}"; then
              return 0
            fi
            if grep -Eq '(\(404\)|HTTP 404|Not Found|NoSuchKey)' "${error_file}"; then
              return 44
            fi
            echo "HEAD failed for ${object_key}." >&2
            cat "${error_file}" >&2
            return 1
          }

          verify_remote() {
            local source_file="$1"
            local object_key="$2"
            local expected_hash="$3"
            local expected_size="$4"
            local local_hash
            local local_size
            local head_file
            local head_error
            local remote_file
            local head_status=0

            local_hash="$(sha256sum "${source_file}" | awk '{print $1}')"
            local_size="$(stat --format=%s "${source_file}")"
            if [ -n "${expected_hash}" ] && [ "${local_hash}" != "${expected_hash}" ]; then
              echo "Local hash differs from signed metadata for ${source_file}." >&2
              return 1
            fi
            if [ -n "${expected_size}" ] && [ "${local_size}" != "${expected_size}" ]; then
              echo "Local size differs from signed metadata for ${source_file}." >&2
              return 1
            fi

            head_file="$(mktemp)"
            head_error="$(mktemp)"
            remote_file="$(mktemp)"
            read_head "${object_key}" "${head_file}" "${head_error}" || head_status=$?
            if [ "${head_status}" -ne 0 ]; then
              rm -f "${head_file}" "${head_error}" "${remote_file}"
              echo "Published object is not readable: ${object_key}." >&2
              return 1
            fi
            node - "${head_file}" "${local_size}" <<'NODE'
          const fs = require('fs');
          const head = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expectedSize = Number(process.argv[3]);
          if (head.ContentLength !== expectedSize) {
              throw new Error(`Remote ContentLength ${head.ContentLength} differs from ${expectedSize}.`);
          }
          NODE
            aws s3api get-object \
              --bucket "${S3_BUCKET}" \
              --key "${object_key}" \
              --endpoint-url "${S3_ENDPOINT}" \
              "${remote_file}" >/dev/null
            if ! cmp --silent "${source_file}" "${remote_file}"; then
              rm -f "${head_file}" "${head_error}" "${remote_file}"
              echo "Immutable object content mismatch: ${object_key}." >&2
              return 1
            fi
            rm -f "${head_file}" "${head_error}" "${remote_file}"
            echo "Verified immutable object ${object_key} (${local_size} bytes, ${local_hash})."
          }

          publish_immutable() {
            local source_file="$1"
            local object_key="$2"
            local content_type="$3"
            local expected_hash="$4"
            local expected_size="$5"
            local local_hash
            local local_size
            local head_file
            local head_error
            local put_output
            local put_error
            local head_status=0
            local put_status=0

            test -f "${source_file}"
            local_hash="$(sha256sum "${source_file}" | awk '{print $1}')"
            local_size="$(stat --format=%s "${source_file}")"
            if [ -n "${expected_hash}" ] && [ "${local_hash}" != "${expected_hash}" ]; then
              echo "Refusing to publish ${source_file}: hash differs from signed metadata." >&2
              return 1
            fi
            if [ -n "${expected_size}" ] && [ "${local_size}" != "${expected_size}" ]; then
              echo "Refusing to publish ${source_file}: size differs from signed metadata." >&2
              return 1
            fi
            head_file="$(mktemp)"
            head_error="$(mktemp)"
            read_head "${object_key}" "${head_file}" "${head_error}" || head_status=$?
            case "${head_status}" in
              0)
                echo "Reusing existing immutable object ${object_key}."
                ;;
              44)
                put_output="$(mktemp)"
                put_error="$(mktemp)"
                aws s3api put-object \
                  --bucket "${S3_BUCKET}" \
                  --key "${object_key}" \
                  --body "${source_file}" \
                  --if-none-match '*' \
                  --endpoint-url "${S3_ENDPOINT}" \
                  --acl public-read \
                  --cache-control 'public,max-age=31536000,immutable' \
                  --content-type "${content_type}" \
                  --metadata "sha256=${local_hash}" >"${put_output}" 2>"${put_error}" || put_status=$?
                if [ "${put_status}" -ne 0 ] && ! grep -Eq '(409|412|ConditionalRequestConflict|PreconditionFailed)' "${put_error}"; then
                  cat "${put_error}" >&2
                  rm -f "${head_file}" "${head_error}" "${put_output}" "${put_error}"
                  return 1
                fi
                if [ "${put_status}" -ne 0 ]; then
                  echo "Another publisher created ${object_key}; verifying its exact bytes."
                fi
                rm -f "${put_output}" "${put_error}"
                ;;
              *)
                rm -f "${head_file}" "${head_error}"
                return 1
                ;;
            esac
            rm -f "${head_file}" "${head_error}"
            verify_remote "${source_file}" "${object_key}" "${expected_hash}" "${expected_size}"
          }

          declare -A signed_hashes=()
          declare -A signed_sizes=()
          while IFS=$'\t' read -r platform filename sha256 size file_url; do
            artifact_key="${platform}/${filename}"
            signed_hashes["${artifact_key}"]="${sha256}"
            signed_sizes["${artifact_key}"]="${size}"
          done < <(node scripts/release-manifest.mjs list-artifacts manifest.json)

          while IFS= read -r -d '' source_file; do
            artifact_key="${source_file#release-package/}"
            platform="${artifact_key%%/*}"
            filename="${artifact_key#*/}"
            case "${filename}" in
              *.exe) content_type='application/vnd.microsoft.portable-executable' ;;
              *.msi) content_type='application/x-msi' ;;
              *) content_type='application/octet-stream' ;;
            esac
            publish_immutable \
              "${source_file}" \
              "winky/${RELEASE_TAG}/${platform}/${filename}" \
              "${content_type}" \
              "${signed_hashes[${artifact_key}]-}" \
              "${signed_sizes[${artifact_key}]-}"
          done < <(find release-package -mindepth 2 -maxdepth 2 -type f ! -path '*/metadata/*' -print0)

          publish_immutable manifest.json "winky/${RELEASE_TAG}/manifest.json" 'application/json' '' ''
          publish_immutable manifest.sig "winky/${RELEASE_TAG}/manifest.sig" 'application/octet-stream' '' ''
          publish_immutable latest.json "winky/${RELEASE_TAG}/latest.json" 'application/json' '' ''

      - name: Verify published manifest and artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_base_url="${S3_ENDPOINT}/${S3_BUCKET}/winky/${RELEASE_TAG}"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "${release_base_url}/latest.json" --output smoke-latest.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "${release_base_url}/manifest.json" --output smoke-manifest.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "${release_base_url}/manifest.sig" --output smoke-manifest.sig
          cmp --silent latest.json smoke-latest.json
          cmp --silent manifest.json smoke-manifest.json
          cmp --silent manifest.sig smoke-manifest.sig
          node scripts/release-manifest.mjs extract-envelope \
            smoke-latest.json smoke-envelope-manifest.json smoke-envelope-manifest.sig
          cmp --silent manifest.json smoke-envelope-manifest.json
          cmp --silent manifest.sig smoke-envelope-manifest.sig

          while IFS= read -r -d '' source_file; do
            artifact_key="${source_file#release-package/}"
            platform="${artifact_key%%/*}"
            filename="${artifact_key#*/}"
            artifact_url="$(node - "${release_base_url}" "${platform}" "${filename}" <<'NODE'
          const baseUrl = `${process.argv[2].replace(/\/$/, '')}/`;
          const path = `${encodeURIComponent(process.argv[3])}/${encodeURIComponent(process.argv[4])}`;
          process.stdout.write(new URL(path, baseUrl).toString());
          NODE
            )"
            remote_file="$(mktemp)"
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              "${artifact_url}" --output "${remote_file}"
            if ! cmp --silent "${source_file}" "${remote_file}"; then
              rm -f "${remote_file}"
              echo "Public artifact smoke check failed: ${artifact_key}." >&2
              exit 1
            fi
            rm -f "${remote_file}"
          done < <(find release-package -mindepth 2 -maxdepth 2 -type f ! -path '*/metadata/*' -print0)

          node - "${RUNNER_TEMP}/winky-update-public.der" <<'NODE'
          const fs = require('fs');
          const prefix = Buffer.from('302a300506032b6570032100', 'hex');
          const publicKey = Buffer.from(process.env.WINKY_UPDATE_PUBLIC_KEY, 'base64');
          if (publicKey.length !== 32) throw new Error('Invalid update public key.');
          fs.writeFileSync(process.argv[2], Buffer.concat([prefix, publicKey]));
          NODE
          openssl pkey -pubin -inform DER \
            -in "${RUNNER_TEMP}/winky-update-public.der" \
            -out "${RUNNER_TEMP}/winky-update-public.pem"
          openssl pkeyutl -verify -pubin -rawin \
            -inkey "${RUNNER_TEMP}/winky-update-public.pem" \
            -in smoke-manifest.json \
            -sigfile smoke-manifest.sig
          node scripts/release-manifest.mjs verify-artifacts smoke-manifest.json

      - name: Publish or resume GitHub Release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          read_release() {
            local output_file="$1"
            local error_file="$2"
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              >"${output_file}" 2>"${error_file}"; then
              return 0
            fi
            if grep -Eq '(HTTP 404|Not Found)' "${error_file}"; then
              return 44
            fi
            cat "${error_file}" >&2
            return 1
          }

          refresh_release() {
            local status=0
            read_release "${release_file}" "${release_error}" || status=$?
            if [ "${status}" -ne 0 ]; then
              echo "GitHub Release ${RELEASE_TAG} is unavailable after publication." >&2
              return 1
            fi
          }

          get_asset_id() {
            local asset_name="$1"
            node - "${release_file}" "${asset_name}" <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const matches = release.assets.filter(asset => asset.name === process.argv[3]);
          if (matches.length > 1) throw new Error(`Duplicate GitHub asset: ${process.argv[3]}`);
          if (matches.length === 1) process.stdout.write(String(matches[0].id));
          NODE
          }

          verify_asset() {
            local source_file="$1"
            local asset_name="$2"
            local asset_id="$3"
            local remote_file
            local local_hash
            local local_size

            remote_file="$(mktemp)"
            gh api \
              --header 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >"${remote_file}"
            if ! cmp --silent "${source_file}" "${remote_file}"; then
              rm -f "${remote_file}"
              echo "GitHub asset content mismatch: ${asset_name}." >&2
              return 1
            fi
            local_hash="$(sha256sum "${source_file}" | awk '{print $1}')"
            local_size="$(stat --format=%s "${source_file}")"
            rm -f "${remote_file}"
            echo "Verified GitHub asset ${asset_name} (${local_size} bytes, ${local_hash})."
          }

          release_file="$(mktemp)"
          release_error="$(mktemp)"
          release_status=0
          read_release "${release_file}" "${release_error}" || release_status=$?
          case "${release_status}" in
            0)
              echo "Resuming existing GitHub Release ${RELEASE_TAG}."
              ;;
            44)
              create_output="$(mktemp)"
              create_error="$(mktemp)"
              create_status=0
              gh release create "${RELEASE_TAG}" \
                --verify-tag \
                --generate-notes \
                --title "Winky ${RELEASE_TAG#v}" >"${create_output}" 2>"${create_error}" || create_status=$?
              if [ "${create_status}" -ne 0 ]; then
                echo "GitHub Release creation raced or failed; checking the tag again."
              fi
              if ! refresh_release; then
                cat "${create_error}" >&2
                rm -f "${create_output}" "${create_error}" "${release_file}" "${release_error}"
                exit 1
              fi
              rm -f "${create_output}" "${create_error}"
              ;;
            *)
              rm -f "${release_file}" "${release_error}"
              exit 1
              ;;
          esac

          mapfile -d '' asset_sources < <(find release-package -type f ! -path '*/metadata/*' -print0)
          asset_sources+=(manifest.json manifest.sig latest.json)
          declare -A asset_names=()
          for source_file in "${asset_sources[@]}"; do
            asset_name="$(basename "${source_file}")"
            if [ -n "${asset_names[${asset_name}]+present}" ]; then
              echo "Duplicate local GitHub asset name: ${asset_name}." >&2
              exit 1
            fi
            asset_names["${asset_name}"]="${source_file}"

            asset_id="$(get_asset_id "${asset_name}")"
            if [ -z "${asset_id}" ]; then
              upload_output="$(mktemp)"
              upload_error="$(mktemp)"
              upload_status=0
              gh release upload "${RELEASE_TAG}" "${source_file}" \
                >"${upload_output}" 2>"${upload_error}" || upload_status=$?
              refresh_release
              asset_id="$(get_asset_id "${asset_name}")"
              if [ -z "${asset_id}" ]; then
                cat "${upload_error}" >&2
                rm -f "${upload_output}" "${upload_error}"
                exit 1
              fi
              if [ "${upload_status}" -ne 0 ]; then
                echo "Another publisher created ${asset_name}; verifying its exact bytes."
              fi
              rm -f "${upload_output}" "${upload_error}"
            else
              echo "Reusing existing GitHub asset ${asset_name}."
            fi
            verify_asset "${source_file}" "${asset_name}" "${asset_id}"
          done
          rm -f "${release_file}" "${release_error}"

      - name: Publish current update manifests
        shell: bash
        run: |
          set -euo pipefail

          read_head() {
            local object_key="$1"
            local output_file="$2"
            local error_file="$3"
            if aws s3api head-object \
              --bucket "${S3_BUCKET}" \
              --key "${object_key}" \
              --endpoint-url "${S3_ENDPOINT}" >"${output_file}" 2>"${error_file}"; then
              return 0
            fi
            if grep -Eq '(\(404\)|HTTP 404|Not Found|NoSuchKey)' "${error_file}"; then
              return 44
            fi
            echo "HEAD failed for ${object_key}." >&2
            cat "${error_file}" >&2
            return 1
          }

          publish_current() {
            local source_file="$1"
            local object_key="$2"
            local comparison_file="$3"
            local head_file
            local head_error
            local current_file
            local etag
            local put_output
            local put_error
            local raced_file
            local head_status=0
            local put_status=0
            local -a condition=()

            head_file="$(mktemp)"
            head_error="$(mktemp)"
            read_head "${object_key}" "${head_file}" "${head_error}" || head_status=$?
            case "${head_status}" in
              0)
                current_file="$(mktemp)"
                aws s3api get-object \
                  --bucket "${S3_BUCKET}" \
                  --key "${object_key}" \
                  --endpoint-url "${S3_ENDPOINT}" \
                  "${current_file}" >/dev/null
                node scripts/release-manifest.mjs check-monotonic \
                  "${current_file}" "${comparison_file}"
                if cmp --silent "${source_file}" "${current_file}"; then
                  echo "${object_key} already has the expected bytes."
                  rm -f "${current_file}" "${head_file}" "${head_error}"
                  return 0
                fi
                etag="$(node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (!h.ETag) throw new Error('Missing object ETag'); process.stdout.write(h.ETag)" "${head_file}")"
                condition=(--if-match "${etag}")
                rm -f "${current_file}"
                ;;
              44)
                condition=(--if-none-match '*')
                ;;
              *)
                rm -f "${head_file}" "${head_error}"
                return 1
                ;;
            esac

            put_output="$(mktemp)"
            put_error="$(mktemp)"
            aws s3api put-object \
              --bucket "${S3_BUCKET}" \
              --key "${object_key}" \
              --body "${source_file}" \
              "${condition[@]}" \
              --endpoint-url "${S3_ENDPOINT}" \
              --acl public-read \
              --cache-control 'public,max-age=60,must-revalidate' \
              --content-type application/json >"${put_output}" 2>"${put_error}" || put_status=$?
            if [ "${put_status}" -ne 0 ]; then
              if ! grep -Eq '(409|412|ConditionalRequestConflict|PreconditionFailed)' "${put_error}"; then
                cat "${put_error}" >&2
                rm -f "${head_file}" "${head_error}" "${put_output}" "${put_error}"
                return 1
              fi
              raced_file="$(mktemp)"
              aws s3api get-object \
                --bucket "${S3_BUCKET}" \
                --key "${object_key}" \
                --endpoint-url "${S3_ENDPOINT}" \
                "${raced_file}" >/dev/null
              if ! cmp --silent "${source_file}" "${raced_file}"; then
                rm -f "${raced_file}" "${head_file}" "${head_error}" "${put_output}" "${put_error}"
                echo "${object_key} changed during publication." >&2
                return 1
              fi
              rm -f "${raced_file}"
            fi
            rm -f "${head_file}" "${head_error}" "${put_output}" "${put_error}"
          }

          publish_current latest.json 'winky/latest-v2.json' manifest.json
          publish_current legacy-latest.json 'winky/latest.json' legacy-latest.json

      - name: Verify current update manifests
        shell: bash
        run: |
          set -euo pipefail
          signed_manifest_url="${S3_ENDPOINT}/${S3_BUCKET}/winky/latest-v2.json?release=${GITHUB_SHA}"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --header 'Cache-Control: no-cache' \
            "${signed_manifest_url}" --output published-current-latest-v2.json
          cmp --silent latest.json published-current-latest-v2.json

          legacy_manifest_url="${S3_ENDPOINT}/${S3_BUCKET}/winky/latest.json?release=${GITHUB_SHA}"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --header 'Cache-Control: no-cache' \
            "${legacy_manifest_url}" --output published-current-legacy.json
          cmp --silent legacy-latest.json published-current-legacy.json
